[project]
name = "beregn"
version = "0.1.0"
description = "Statiske beregningsrapporter efter Eurocode – modulære eftervisninger, norm-lag og automatisk rapport"
requires-python = ">=3.10"
dependencies = ["pyyaml", "jinja2", "openpyxl"]

[project.optional-dependencies]
pdf = ["weasyprint>=60"]
test = ["pytest"]

[project.scripts]
beregn = "beregn.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["beregn*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.csv", "*.css", "*.j2"]
