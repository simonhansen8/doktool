# EN 1993-1-1 – de anbefalede værdier fra standardens noter (uden nationalt anneks).
# Bruges som grundlag; et nationalt anneks arver herfra og overskriver de NDP'er, der afviger.
navn: "EN 1993-1-1 – anbefalede værdier"
standard: "EN 1993-1-1:2005 + AC:2009 + A1:2014"
status: "Anbefalede værdier (ingen national tilpasning)"

parametre:
  gamma_M0:
    vaerdi: 1.00
    beskrivelse: "Partialkoefficient, tværsnitsbæreevne"
    kilde: "EN 1993-1-1, 6.1(1)"
  gamma_M1:
    vaerdi: 1.00
    beskrivelse: "Partialkoefficient, stabilitet"
    kilde: "EN 1993-1-1, 6.1(1)"
  gamma_M2:
    vaerdi: 1.25
    beskrivelse: "Partialkoefficient, brud i træk"
    kilde: "EN 1993-1-1, 6.1(1)"
  E:
    vaerdi: 210000
    enhed: MPa
    beskrivelse: "Elasticitetsmodul"
    kilde: "EN 1993-1-1, 3.2.6(1)"
  G:
    vaerdi: 81000
    enhed: MPa
    beskrivelse: "Forskydningsmodul"
    kilde: "EN 1993-1-1, 3.2.6(1)"
  eta:
    vaerdi: 1.2
    beskrivelse: "Faktor for forskydningsareal"
    kilde: "EN 1993-1-5, 5.1(2)"
  fy_kilde:
    vaerdi: "tabel_3_1"          # tabel_3_1 | produktstandard
    beskrivelse: "Kilde til fy og fu"
    kilde: "EN 1993-1-1, 3.2.1(1)"
  kip_metode:
    vaerdi: "valsede"            # generel (6.3.2.2) | valsede (6.3.2.3)
    beskrivelse: "Metode for kipningsreduktionsfaktor"
    kilde: "EN 1993-1-1, 6.3.2.3(1)"
  lambda_bar_LT_0:
    vaerdi: 0.4
    beskrivelse: "Plateaulængde for kipning (valsede profiler)"
    kilde: "EN 1993-1-1, 6.3.2.3(1)"
  beta_LT:
    vaerdi: 0.75
    beskrivelse: "Korrektionsfaktor for kipning (valsede profiler)"
    kilde: "EN 1993-1-1, 6.3.2.3(1)"
  kip_f_faktor:
    vaerdi: true
    beskrivelse: "Modifikationsfaktor f for momentfordeling anvendes"
    kilde: "EN 1993-1-1, 6.3.2.3(2)"

tabeller:
  imperfektionsfaktor:            # tabel 6.1 og 6.3
    kilde: "EN 1993-1-1, tabel 6.1 / 6.3"
    a0: 0.13
    a: 0.21
    b: 0.34
    c: 0.49
    d: 0.76
  kipkurve_generel:               # tabel 6.4, valsede I-profiler
    kilde: "EN 1993-1-1, tabel 6.4"
    graenser: [{h_b_max: 2.0, kurve: a}, {h_b_max: 999, kurve: b}]
  kipkurve_valsede:               # tabel 6.5, valsede I-profiler
    kilde: "EN 1993-1-1, tabel 6.5"
    graenser: [{h_b_max: 2.0, kurve: b}, {h_b_max: 999, kurve: c}]
